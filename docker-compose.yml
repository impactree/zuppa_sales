version: '3.9'

services:
  backend:
    build:
      context: ./zuppa_sales_backend
      dockerfile: Dockerfile
    container_name: zuppa_backend
    env_file:
      - ./zuppa_sales_backend/.env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zuppa_net

  frontend:
    build:
      context: ./zuppa_sales_frontend
      dockerfile: Dockerfile
    container_name: zuppa_frontend
    env_file:
      - ./zuppa_sales_frontend/.env
    environment:
      NEXT_PUBLIC_BE: http://backend:5000/
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zuppa_net

  postgres:
    image: postgres:16-alpine
    container_name: zuppa_postgres
    environment:
      POSTGRES_DB: valencedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zuppa_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zuppa_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zuppa_net

volumes:
  postgres_data:

networks:
  zuppa_net:
    driver: bridge
